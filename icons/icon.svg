<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4be6"/>
      <stop offset="1" stop-color="#4a2fbf"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece8fb"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- soft spotlight -->
  <circle cx="512" cy="560" r="400" fill="#7d61ee" opacity=".45"/>
  <!-- stars -->
  <g fill="#ffcf3f">
    <path d="M190 230 l18 44 44 18 -44 18 -18 44 -18-44 -44-18 44-18z"/>
    <path d="M840 300 l12 30 30 12 -30 12 -12 30 -12-30 -30-12 30-12z" opacity=".9"/>
    <circle cx="250" cy="760" r="14" opacity=".8"/>
  </g>
  <!-- ghost -->
  <g transform="translate(0,20)">
    <ellipse cx="470" cy="880" rx="200" ry="26" fill="#2c1a86" opacity=".35"/>
    <path d="M300 520 C300 370 380 290 470 290 C560 290 640 370 640 520 L640 820
             Q612 790 584 820 Q556 850 528 820 Q499 790 470 820 Q441 850 412 820 Q384 790 356 820 Q328 850 300 820 Z"
          fill="url(#ghost)"/>
    <!-- eyes -->
    <ellipse cx="420" cy="520" rx="30" ry="40" fill="#1d1a2b"/>
    <ellipse cx="520" cy="520" rx="30" ry="40" fill="#1d1a2b"/>
    <circle cx="430" cy="505" r="10" fill="#fff"/>
    <circle cx="530" cy="505" r="10" fill="#fff"/>
    <!-- singing mouth -->
    <ellipse cx="470" cy="610" rx="30" ry="36" fill="#1d1a2b"/>
    <ellipse cx="470" cy="626" rx="18" ry="14" fill="#ff7aa8"/>
    <!-- cheeks -->
    <ellipse cx="372" cy="585" rx="26" ry="15" fill="#ff9fc0" opacity=".7"/>
    <ellipse cx="568" cy="585" rx="26" ry="15" fill="#ff9fc0" opacity=".7"/>
  </g>
  <!-- music note -->
  <g fill="#ffcf3f" transform="translate(655,330) rotate(12)">
    <rect x="96" y="0" width="30" height="250" rx="10"/>
    <path d="M110 0 C150 30 210 40 230 110 C200 80 160 78 126 70 Z"/>
    <ellipse cx="72" cy="250" rx="70" ry="52" transform="rotate(-20 72 250)"/>
  </g>
</svg>
